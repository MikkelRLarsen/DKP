services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dkp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - dkp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - dkp-pgadmin-data:/var/lib/pgadmin
    labels:
      - traefik.enable=true
      - traefik.http.routers.dkp-pgadmin.rule=Host(`${PGADMIN_HOST:-pgadmin.coffecottage.dk}`)
      - traefik.http.routers.dkp-pgadmin.entrypoints=websecure
      - traefik.http.routers.dkp-pgadmin.tls.certresolver=letsencrypt
      - traefik.http.services.dkp-pgadmin.loadbalancer.server.port=80

  dkp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DKP_IMAGE:-dkp:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dkp};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Discord__ClientId: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in .env}
      Discord__GuildId: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID in .env}
      Discord__OfficerUserIds__0: ${DISCORD_OFFICER_USER_IDS__0:-}
      Discord__OfficerUserIds__1: ${DISCORD_OFFICER_USER_IDS__1:-}
      Discord__RedirectUri: ${DISCORD_REDIRECT_URI:-https://wowforever.coffecottage.dk/signin-discord}
      DkpBot__ApiSecret: ${DKP_BOT_API_SECRET:?Set DKP_BOT_API_SECRET in .env}
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dkp.rule=Host(`${DKP_HOST:-wowforever.coffecottage.dk}`)
      - traefik.http.routers.dkp.entrypoints=websecure
      - traefik.http.routers.dkp.tls.certresolver=letsencrypt
      - traefik.http.services.dkp.loadbalancer.server.port=8080
      - com.centurylinklabs.watchtower.enable=true

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.discordbot
    image: ${DKP_BOT_IMAGE:-dkp-discord-bot:local}
    restart: unless-stopped
    depends_on:
      dkp:
        condition: service_started
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?Set DISCORD_APPLICATION_ID in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID in .env}
      DKP_BOT_API_URL: http://dkp:8080
      DKP_BOT_API_SECRET: ${DKP_BOT_API_SECRET:?Set DKP_BOT_API_SECRET in .env}
      DISCORD_OFFICER_CHANNEL_ID: ${DISCORD_OFFICER_CHANNEL_ID:-}
      DISCORD_MEDLEM_CHANNEL_ID: ${DISCORD_MEDLEM_CHANNEL_ID:-}
    labels:
      - com.centurylinklabs.watchtower.enable=true

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=${TRAEFIK_DASHBOARD_ENABLED:-false}
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dkp-traefik-letsencrypt:/letsencrypt

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dkp-postgres-data:
  dkp-pgadmin-data:
  dkp-traefik-letsencrypt:
