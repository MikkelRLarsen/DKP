# Local testing override. Use together with docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.ngrok.yml up -d --build
services:
  dkp:
    ports:
      - "127.0.0.1:8080:8080"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      dkp:
        condition: service_started
    command:
      - http
      - dkp:8080
      - --url
      - ${NGROK_URL:?Set NGROK_URL in .env}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
